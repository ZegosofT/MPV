# =============================================================
#  skip_intro.conf  -  Single source of truth for what gets skipped
# =============================================================
#
# Each line is one category. List the EXACT chapter titles you want
# skipped (quoted, comma-separated). Matching is case-insensitive
# and whitespace-tolerant, so "opening" / "Opening" / "OPENING " all
# match the same chapter.
#
# A bare number (e.g. ending=6) or a "Chapter N" string also matches
# by 1-based chapter index — useful when chapters have no real title.
#
# CATEGORIES (match the 3 UOSC Skip Options toggles):
#   opening = OP    (skipped when "Skip Opening" is ON)
#   intro   = Intro
#   ending  = ED/PV (skipped when "Skip Ending" is ON)
#
# To apply edits without restarting mpv:
#   Menu -> Skip Options -> Reload Overrides
#   (or run from console:  script-message reload-skip-intro)
#
# Add new strings as you encounter them — this file is the single
# source of truth, nothing is auto-detected from elsewhere.
# =============================================================

opening="opening","OP","Opening Credits","Chapter 2"

intro="intro","Cold Open","Chapter 12"

ending="ending","ED","End Credits","Preview","Next Episode","Chapter 6"
