# =============================================================
#  Manual chapter overrides for skip_intro.lua
# =============================================================
#
# When the auto-detection doesn't recognise a chapter (because its
# title is just "Chapter 1", "Chapter 2", etc. with no OP/ED keyword),
# you can force a category here.
#
# TWO ways to declare an override:
#
#   1) By chapter TITLE  (quoted strings - whitespace & case tolerant)
#         intro="Chapter 2"
#         opening="Chapter 4"
#         ending="Chapter 6","Chapter 24"
#
#   2) By chapter NUMBER (1-based - first chapter = 1)
#         opening=1
#         intro=3
#         ending=6,12
#
# You can MIX both formats on the same line:
#         ending=6,"Chapter 24"
#
# -------------------------------------------------------------
#  Categories (match the 3 UOSC toggle buttons):
#    opening = OP    (skipped when Skip Opening is ON)
#    intro   = Intro
#    ending  = ED/PV (skipped when Skip Ending is ON)
# -------------------------------------------------------------
#
# When edits take effect:
#   - Automatically on the next file load.
#   - Mid-playback: open the console (²) and run:
#         script-message reload-skip-intro
#
# Leave a value empty to disable the override for that category.
# =============================================================

opening="Chapter 2"
intro="Chapter 12"
ending="Chapter 6"
