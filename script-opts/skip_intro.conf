# =============================================================
#  skip_intro.conf  -  Single source of truth for what gets skipped
# =============================================================
#
# Each line is one category. List the EXACT chapter titles you want
# skipped (quoted, comma-separated). Matching is case-insensitive
# and whitespace-tolerant, so "opening" / "Opening" / "OPENING " all
# match the same chapter.
#
# Only the chapter TITLE is matched. The chapter's position/index in
# the file is never used.
#
# CATEGORIES:
#   opening = OP    (toggled by "Skip Opening")
#   intro   = Intro (toggled by "Skip Intro")
#   ending  = ED    (toggled by "Skip Ending")
#   preview = PV    (also toggled by "Skip Ending")
#
# Per-category countdown:
#   <category>_countdown=<seconds>
# Sets how long the "X IN N seconds" prompt stays visible before
# auto-skip. Default is 5. Use 0 for instant skip (no OSD, no cancel
# window — chapter just zaps past). Negative = treated as 0.
#
# To apply edits without restarting mpv:
#   Menu -> Skip Options -> Reload Overrides
#   (or run from console:  script-message reload-skip-intro)
# =============================================================

intro_countdown=5
intro="intro","Cold Open","Chapter 12"

opening_countdown=5
opening="opening","OP","Opening Credits","Chapter 2"


ending_countdown=5
ending="ending","ED","End Credits","Chapter 6"

preview_countdown=0
preview="preview","Next Episode"
