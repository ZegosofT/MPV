# =============================================================
#  history.conf  -  Recently-Played list + auto-resume (scripts/history.lua)
# =============================================================

# --- Folder exclusion --------------------------------------------------------
# Folders listed here are EXCLUDED from history. Any file inside one of them
# (or its subfolders) is:
#   * never added to history,
#   * never shown in the "Recently Played" menu,
#   * never auto-resumed when mpv opens with no file.
#
# Rules:
#   * Separate multiple folders with a semicolon  ;
#   * Case-insensitive. Backslashes or forward slashes both work.
#   * "~" expands to your user folder  (e.g. ~/Desktop).
#   * Matching is recursive: excluding a folder also excludes everything under it.
#
# Examples:
#   exclude=C:\Users\TOM-DESKTOP\Documents\Tom\SP
#   exclude=~/Desktop;O:\Temp;C:\Users\TOM-DESKTOP\Downloads\_P2P
exclude=C:\Users\TOM-DESKTOP\Documents\Tom\SP

# --- Other options -----------------------------------------------------------
# Maximum stored entries (oldest are dropped).
max_entries=50

# Ignore files that played for fewer than this many seconds.
min_duration=5

# Auto-open the most recent (non-excluded) file when mpv launches with no file.
auto_resume=yes
