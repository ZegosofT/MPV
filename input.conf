# vim: syntax=config

###########
#  Mouse  #
###########
MBTN_LEFT                                        cycle pause
MBTN_LEFT_DB                                     cycle fullscreen

MBTN_RIGHT                                       script-binding uosc/menu

MBTN_FORWARD                                     no-osd script-binding betterchapters/chapter_next
SHIFT+ALT+MBTN_FORWARD                           playlist-next

MBTN_BACK                                        no-osd script-binding betterchapters/chapter_prev
SHIFT+ALT+MBTN_BACK                              script-binding smart_prev/smart-prev

SHIFT+MBTN_MID                                   script-binding skip_step/set-skip-step
MBTN_MID                                         script-binding skip_step/do-skip

WHEEL_UP                                         add volume +1 ; script-binding uosc/flash-volume
WHEEL_DOWN                                       add volume -1 ; script-binding uosc/flash-volume

############
#  F-Keys  #
############
F1                                               add sub-delay -0.1

F2                                               add sub-delay +0.1

F3                                               add audio-delay -0.1

F4                                               add audio-delay +0.1

F5
SHIFT+F5                                         screenshot window

F6                                               ignore
F7                                               ignore
F8                                               ignore
F9                                               ignore
F10                                              ignore
F11                                              ignore
F12                                              ignore

##################
#  Top Row Keys  #
##################

²                                                script-binding console/enable

1                                                add contrast -1 ; script-binding uosc/flash-ui
&                                                add contrast +1 ; script-binding uosc/flash-ui
CTRL+&                                           script-binding anime-mode-on

2                                                add contrast -1 ; script-binding uosc/flash-ui
é                                                add contrast +1 ; script-binding uosc/flash-ui
CTRL+é                                           script-binding anime-mode-off

3                                                add brightness -1 ; script-binding uosc/flash-ui
"                                                add brightness +1 ; script-binding uosc/flash-ui

4                                                add brightness -1 ; script-binding uosc/flash-ui
'                                                add brightness +1 ; script-binding uosc/flash-ui

5                                                add gamma -1 ; script-binding uosc/flash-ui
(                                                add gamma +1 ; script-binding uosc/flash-ui

6                                                add gamma -1 ; script-binding uosc/flash-ui
-                                                add gamma +1 ; script-binding uosc/flash-ui
CTRL+-                                           no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"

7                                                add saturation -1 ; script-binding uosc/flash-ui
è                                                add saturation +1 ; script-binding uosc/flash-ui

8                                                add saturation -1 ; script-binding uosc/flash-ui
_                                                add saturation +1 ; script-binding uosc/flash-ui

9                                                ignore
0                                                ignore

]                                                ignore

}                                                ignore


################
#  A - Z Keys  #
################


a                                                script-binding uosc/audio
A                                                cycle audio
CTRL+a                                           script-binding auto_audio_device/toggle-switching
CTRL+SHIFT+A                                     cycle-values audio-spdif "ac3,dts,eac3,truehd,dtshd" "no" ; show-text "Audio: ${?audio-spdif==no:PCM (Upmix Active)}${!audio-spdif==no:Bitstream (Passthrough)}"

b                                                cycle deband
CTRL+b                                           script-message toggle-anime-fidelity

c                                                ignore

d                                                cycle deinterlace
D                                                script-binding open-anime-menu

e                                                script-binding file_browser/open-browser
E                                                cycle edition
ALT+e                                            add panscan +0.1
CTRL+ALT+€                                       add panscan -0.1

f                                                cycle fullscreen
CTRL+f                                           script-binding file_browser/open-browser


g                                                cycle-values interpolation yes no ; show-text "Interpolation: ${interpolation}"
G                                                cycle-values tscale "linear" "catmull_rom" "mitchell" "bicubic" "oversample" ; show-text "Interpolation: ${interpolation} (${tscale})"
CTRL+g                                           script-message toggle-global-shaders

h                                                ignore
H                                                script-binding toggle-hdr-hybrid

i                                                script-binding stats/display-stats-toggle
I                                                script-binding stats/display-stats
CTRL+i                                           script-binding toggle-stats

j                                                ignore

k                                                show-text "Audio Filters: ${af}\nVideo Filters: ${vf}\nShaders: ${glsl-shaders}"
K                                                script-binding show-profile-info
CTRL+k                                           script-message toggle-adaptive-sharpen

l                                                ab-loop
L                                                script-binding toggle-anime4k-quality
CTRL+l                                           script-binding anime-mode-auto

m                                                cycle-values af "lavfi=[surround=chl_out=7.1:lfe_low=80]" "" ; show-text "7.1 Upmix (Enhanced Bass)"

#n

o                                                cycle-values osd-level 3 1

p                                                cycle-values video-rotate 90 180 270 0
P                                                cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "16:10" "-1"
CTRL+p                                           script-binding toggle-power

q                                                ignore
Q                                                script-message toggle-hq-hd-nnedi
CTRL+q                                           script-message toggle-hq-sd
CTRL+ALT+q                                       no-osd script-binding betterchapters/chapter_next

r                                                add sub-pos -1
R                                                add sub-pos -1

s                                                script-binding uosc/subtitles
ALT+s                                            add sub-scale  0.05
CTRL+ALT+s                                       add sub-scale  -0.05
CTRL+ALT+SHIFT+s                                 cycle secondary-sid


t                                                cycle-values sub-use-margins "yes" "no"
T                                                cycle-values ass-force-margins "yes" "no"
CTRL+t                                           cycle-values blend-subtitles "yes" "video" "no"

u                                                cycle-values hwdec "auto" "no" "auto-copy" ; show-text "HW Decoder: ${hwdec}"

v                                                cycle sub-visibility

w                                                script-binding uosc/items

x                                                ignore
CTRL+x                                           script-message toggle-crop-ambient

y                                                cycle-values sub-ass-use-video-data "none" "aspect-ratio" "all"

z                                                ignore

##############
#  Nav Keys  #
##############
LEFT                                             seek -5  relative+keyframes
SHIFT+LEFT                                       seek -5  relative+exact
CTRL+LEFT                                        frame-back-step ; show-text "Frame: ${estimated-frame-number} / ${estimated-frame-count}"
SHIFT+ALT+LEFT                                   SHIFT+ALT+MBTN_BACK                              script-binding smart_prev/smart-prev

RIGHT                                            seek +5  relative+keyframes
SHIFT+RIGHT                                      seek +5  relative+exact
CTRL+RIGHT                                       frame-step ; show-text "Frame: ${estimated-frame-number} / ${estimated-frame-count}"
SHIFT+ALT+RIGHT                                  playlist-next

UP                                               add volume +2 ; script-binding uosc/flash-volume
CTRL+UP                                          add speed 0.5

DOWN                                             add volume -2 ; script-binding uosc/flash-volume
CTRL+DOWN                                        add speed -0.5

PGUP                                             no-osd script-binding betterchapters/chapter_next
SHIFT+PGUP                                       playlist-next

PGDWN                                            no-osd script-binding betterchapters/chapter_prev
SHIFT+PGDWN                                      script-binding smart_prev/smart-prev

TAB                                              script-binding uosc/menu

BS                                               set speed 1
SHIFT+BS                                         set sub-scale 1.0
                                                                        

<                                                script-binding anime_profile_controller/open-zego-custom-menu
#>

#KP_SUBTRACT
#KP_ADD

#####################
#  Right Side Keys  #
#####################
!                                                cycle ontop

